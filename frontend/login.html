<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whytrip</title>
  <link rel="shortcut icon" href="assets/img/icon.png" type="image/x-icon">

  <!--Stylesheet-->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="assets/styles/registers.css">


</head>

<body>

  <div class="register-content">
    <div class="register-form col-md-6">
      <nav class="logo mt-5">
        <a class="navbar-brand" href="index.html">
          <img src="assets/img/Logo-1.png" alt="Whytrip" loading="lazy">
        </a>
      </nav>

      <div class="register">
        <div class="title mt-5">
          <h2>Selamat Datang Kembali</h2>
        </div>
        <div class="register mt-5">
          <form id="loginForm">
            <div class="form-group">
              <label>Email</label>
              <input type="email" class="form-control" id="loginEmail" placeholder="Masukkan Email" required>
            </div>

            <div class="form-group">
              <label>Password</label>
              <input type="password" class="form-control" id="loginPassword" placeholder="Masukan Password" required>
              <!-- Remove toggle eyes to prevent multi-ID issues -->
            </div>
            <div class="help">
              <div class="input-group mb-3">
                <div class="input-group-text bg-transparent">
                  <input type="checkbox">
                  <p class="my-3 ml-2">Ingat saya?</p>
                </div>
              </div>

              <p class="sandi text-muted mt-3 col-md-6">Lupa Kata Sandi?</p>
            </div>

            <div class="btn-register">
              <button type="submit" class="btn btn-login mt-3" id="btnLogin">Login</button>
              <div id="loginMessage" class="mt-2 text-center" style="font-weight: 600;"></div>
            </div>
          </form>
          <div class="or">
            <hr class="left">
            <p class="mt-3 text-center">Atau</p>
            <hr class="right">
          </div>

          <button type="button" class="btn btn-google ">
            <img src="https://img.icons8.com/color/48/000000/google-logo.png" />
            Lanjutkan dengan Google
          </button>
        </div>

        <div class="akun text-center mt-5 mb-5">
          <p>Belum Memiliki akun? <a href="register.html">Register</a></p>
        </div>
      </div>
    </div>
  </div>

  <div class="register-ilus">
    <img src="assets/img/ilus-login.png" alt="" class="ml-5 login">
  </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"
    integrity="sha512-bLT0Qm9VnAYZDflyKcBaQ2gg0hSYNQrJ8RilYldYQ1FxQYoCLtUjuuRuZo+fjqhx/qtq/1itJ0C2ejDxltZVFg=="
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
    integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
    crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"
    integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV"
    crossorigin="anonymous"></script>
  <script src="assets/script/main.js"></script>
</body>

</html>
